version: '3.8'

services:
  # Dashboard + Scraper (recommended)
  bambu-dashboard:
    build: .
    container_name: bambu-dashboard
    ports:
      - "5300:5300"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      - TZ=Europe/Amsterdam
    command: ["python", "server.py"]
    restart: unless-stopped

  # Run once and exit (for cron on host or manual runs)
  bambu-scraper:
    build: .
    container_name: bambu-scraper
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Europe/Amsterdam

  # Multi-store loop without dashboard (headless)
  bambu-scraper-loop:
    build: .
    container_name: bambu-scraper-loop
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      - TZ=Europe/Amsterdam
    command: ["python", "scraper.py", "--csv", "--multi-loop"]
    restart: unless-stopped
