version: '3.8'

services:
  bambu-scraper:
    build: .
    container_name: bambu-scraper
    volumes:
      # Persist data between runs
      - ./data:/app/data
      # Your config with webhooks
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Europe/Amsterdam
    # Run once and exit (for cron on host)
    # Or use the cron service below for scheduled runs

  # Optional: scheduled runs inside container
  bambu-scraper-cron:
    build: .
    container_name: bambu-scraper-cron
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Europe/Amsterdam
      - CRON_SCHEDULE=0 * * * *  # Every hour
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$$CRON_SCHEDULE python /app/scraper.py --csv >> /var/log/scraper.log 2>&1" | crontab -
        cron -f
    restart: unless-stopped
