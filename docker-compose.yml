version: '3.8'

services:
  # Run once and exit (for cron on host or manual runs)
  bambu-scraper:
    build: .
    container_name: bambu-scraper
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Europe/Amsterdam

  # Keep running, scrape every hour (recommended)
  bambu-scraper-loop:
    build: .
    container_name: bambu-scraper-loop
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Europe/Amsterdam
    command: ["python", "scraper.py", "--csv", "--loop", "60"]
    restart: unless-stopped
